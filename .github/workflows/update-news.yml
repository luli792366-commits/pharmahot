name: Update PharmaHot News
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_news.py'
      - 'scripts/update_preclinical.py'
      - '.github/workflows/update-news.yml'
  schedule:
    # Every Monday 00:17 UTC = Monday 08:17 China Standard Time
    - cron: '17 0 * * 1'
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Archive previous weekly edition
        run: python scripts/archive_week.py
      - name: Aggregate public pharma feeds
        run: python scripts/update_news.py
      - name: Aggregate preclinical and discovery feeds
        run: python scripts/update_preclinical.py
      - name: Commit weekly update and history
        run: |
          git config user.name "pharmahot-bot"
          git config user.email "pharmahot-bot@users.noreply.github.com"
          git add data/news.json data/preclinical.json data/archive/
          git diff --cached --quiet || git commit -m "chore: weekly PharmaHot update"
          git push
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload refreshed site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy refreshed site
        id: deployment
        uses: actions/deploy-pages@v4
