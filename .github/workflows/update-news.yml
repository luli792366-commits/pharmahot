name: Update PharmaHot News
on:
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * 1'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aggregate public pharma feeds
        run: python scripts/update_news.py
      - name: Commit weekly update
        run: |
          git config user.name "pharmahot-bot"
          git config user.email "pharmahot-bot@users.noreply.github.com"
          git add data/news.json
          git diff --cached --quiet || git commit -m "chore: weekly PharmaHot update"
          git push
